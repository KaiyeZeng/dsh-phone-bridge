name: check and publish

# Two things happen here. The check job runs on every push and pull request and
# fails on doc/code drift or a plugin that will not load. The publish job keys off
# the version field rather than the push: a package is published only when its own
# package.json version is not on npm yet, so an ordinary commit publishes nothing
# and a release is just "bump the version, commit, push".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The maintenance model is "fix it by hand when DSH changes", so the whole thing
  # rests on finding out early. This is what finds out: every morning it re-checks
  # the DSH interface against npm, and a rename or a removal there turns the build
  # red before any user has upgraded.
  schedule:
    - cron: "17 1 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fails if either half cannot be imported, or its exported contract is wrong.
      - name: Both halves load
        run: node scripts/smoke.mjs

      # Fails if a command, config key or route is in the code but not the docs,
      # or the other way round. This is the check that would have caught the
      # readme claiming there was no install script two releases after there was.
      - name: Docs and code agree
        run: node scripts/check-docs.mjs

      # Fails when DSH renames or drops something the plugin calls. The plugin does
      # not adapt on the fly - a guessed alias binding to the wrong method would be
      # worse than a red build - so this early warning is what makes manual
      # maintenance workable.
      - name: The DSH interface still has what we call
        run: node scripts/check-dsh-contract.mjs

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # contents: write is for pushing the release tags below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish every package whose version is new
        id: pub
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          published=""
          for dir in dsh-plugin openclaw-plugin; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already on npm, skipping"
              continue
            fi
            echo "::notice::publishing $name@$version"
            (cd "$dir" && npm publish)
            published="$published $dir"
          done
          echo "published=$published" >> "$GITHUB_OUTPUT"

      # The two packages version independently, so the tag carries which one it
      # belongs to: dsh-plugin-v0.2.3, openclaw-plugin-v0.2.2.
      - name: Tag what was published
        if: steps.pub.outputs.published != ''
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in ${{ steps.pub.outputs.published }}; do
            version=$(node -p "require('./$dir/package.json').version")
            tag="${dir}-v${version}"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::notice::$tag already exists, skipping"
              continue
            fi
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
            echo "::notice::tagged $tag"
          done
